# ===========================================================================
# EXAMPLE: fully declarative secrets with the External Secrets Operator, so
# nothing has to be created by hand and nothing sensitive lands in git.
#
# Put these in their own Argo CD Application (or add them to
# manifests/platform/) with a sync wave LOWER than the Helm release, e.g.
# sync-wave "-5", so the secrets exist before the pods start.
#
# API version note: ESO >= 0.10 also serves external-secrets.io/v1. Match
# whatever your cluster has: `oc api-resources | grep externalsecret`.
# ===========================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: artifactory-cluster-keys
  namespace: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend          # <- your (Cluster)SecretStore
    kind: ClusterSecretStore
  target:
    name: artifactory-cluster-keys
    creationPolicy: Owner
  data:
    # NEVER rotate master-key after the first start: it encrypts everything
    # stored in the database.
    - secretKey: master-key
      remoteRef:
        key: artifactory/cluster-keys
        property: master-key
    - secretKey: join-key
      remoteRef:
        key: artifactory/cluster-keys
        property: join-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: artifactory-postgresql
  namespace: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: artifactory-postgresql
    creationPolicy: Owner
  data:
    # Bitnami key names - do not rename.
    - secretKey: postgres-password
      remoteRef:
        key: artifactory/postgresql
        property: postgres-password
    - secretKey: password
      remoteRef:
        key: artifactory/postgresql
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: artifactory-admin-creds
  namespace: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: artifactory-admin-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The chart mounts this key verbatim as access/bootstrap.creds.
        bootstrap.creds: "admin@127.0.0.1={{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: artifactory/admin
        property: password
