---
# Default-deny ingress for the namespace, then allow exactly what Artifactory
# needs: the OpenShift router (external traffic) and pod-to-pod traffic inside
# the namespace (Artifactory <-> PostgreSQL).
# Remove this file from kustomization.yaml if your cluster policy model is
# handled elsewhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-router
  namespace: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  podSelector:
    matchLabels:
      app: artifactory
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        # Older label form, kept for 4.x clusters that still use it.
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
