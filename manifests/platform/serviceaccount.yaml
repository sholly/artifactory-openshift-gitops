---
# Dedicated ServiceAccount for the Artifactory StatefulSet.
# The Helm chart is told to use (not create) this SA via
# serviceAccount.create=false / serviceAccount.name=artifactory so that the
# SCC binding below exists before the workload is scheduled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifactory
  namespace: artifactory
  labels:
    app.kubernetes.io/name: artifactory
    app.kubernetes.io/part-of: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
