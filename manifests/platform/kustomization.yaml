apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster/namespace plumbing that must exist before the Helm release syncs.
# Managed by the `artifactory-platform` Argo CD Application.
#
# NOTE: deliberately no `commonLabels` here - kustomize would inject the label
# into NetworkPolicy podSelectors as well, which would silently narrow the
# policies below to pods that don't carry that label.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - scc.yaml
  - rbac.yaml
  - route.yaml
  - networkpolicy.yaml
