---
# Grants the artifactory ServiceAccount the right to use artifactory-scc.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: artifactory-use-scc
  namespace: artifactory
  labels:
    app.kubernetes.io/part-of: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - artifactory-scc
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: artifactory-use-scc
  namespace: artifactory
  labels:
    app.kubernetes.io/part-of: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: artifactory-use-scc
subjects:
  - kind: ServiceAccount
    name: artifactory
    namespace: artifactory
